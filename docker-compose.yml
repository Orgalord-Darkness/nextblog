services: 

  app: 
    build: 
    restart: always
    ports:
      - "8008:3000"
    environment: 
      DATABASE_URL: mysql://user:password@db:3306/nextblog
    depends_on:
      - db

  db: 
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nextblog
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports: 
      - "3309:3306"
    volumes: 
      - db_data:/vat/lib/mysql

volumes: 
  db_data: 