services:
  db: 
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nextblog
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports: 
      - "3309:3306"
    volumes: 
      - db_data:/var/lib/mysql 
    healthcheck: 
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  app: 
    build: .
    restart: always
    ports:
      - "8001:3000"
    environment: 
      DATABASE_URL: mysql://user:password@db:3306/nextblog
    depends_on:
      db: 
        condition: service_healthy 
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes: 
  db_data: 